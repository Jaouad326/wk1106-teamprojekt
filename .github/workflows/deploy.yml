name: Build and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci
      - name: Build frontend
        run: npm run build
      - name: Run backend tests
        run: npm --prefix backend test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Trust deployment host
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> "$HOME/.ssh/known_hosts"
      - name: Update server
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'REMOTE'
          set -eu
          cd /home/azureuser/wk1106-teamprojekt
          git fetch origin main
          git reset --hard origin/main
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci
          npm run build
          npm --prefix backend run migrate
          sudo systemctl restart studyprio
          REMOTE